<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Laboratorium UMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                    colors: { primary: { 700: '#1e40af', 800: '#1e3a8a' } }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="css/print.css">
</head>
<body class="font-sans bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen">

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-slate-900 text-slate-200 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300" id="sidebar">
            <div class="flex items-center gap-2 px-5 h-16 border-b border-slate-800">
                <img src="https://susitao.uma.ac.id/assets/img/logo-main.webp" class="w-9 h-9 rounded-lg object-contain bg-white p-1" alt="Logo">
                <div class="leading-tight"><p class="font-bold text-sm text-white">LABORATORIUM</p><p class="text-[9px] uppercase tracking-widest text-slate-400">Dashboard UMA</p></div>
            </div>
            <nav class="flex-1 overflow-y-auto p-3 space-y-1" id="sidebar-nav"></nav>
            <div class="p-3 border-t border-slate-800">
                <a href="https://laboratorium.uma.ac.id/" target="_blank" class="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 transition"><i data-lucide="external-link" class="w-4 h-4"></i> Situs Asli UMA</a>
            </div>
        </aside>

        <div class="fixed inset-0 bg-slate-900/60 z-30 hidden" id="side-backdrop" onclick="toggleSidebar()"></div>

        <!-- MAIN -->
        <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-20 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between px-4 md:px-6 h-16">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center"><i data-lucide="menu" class="w-5 h-5"></i></button>
                        <a href="../index.html" id="back-site" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-cyan-600 dark:hover:text-cyan-400 transition"><i data-lucide="home" class="w-4 h-4"></i> Web Utama</a>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold text-slate-800 dark:text-white" id="user-name">-</p>
                            <p class="text-[11px] text-cyan-600 dark:text-cyan-400" id="user-role">-</p>
                        </div>
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 text-white flex items-center justify-center font-bold" id="user-avatar">*</div>
                        <button id="logout-btn" title="Keluar" class="w-10 h-10 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-slate-500 hover:text-red-600 flex items-center justify-center transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </header>

            <main id="content" class="flex-1"></main>
        </div>
    </div>

    <!-- Area cetak tersembunyi -->
    <div id="print-area" style="display:none;"></div>

    <!-- Load order: helpers → API → auth → router → views -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/print.js"></script>
    <script src="js/app.js"></script>
    <script src="js/views-admin.js"></script>
    <script src="js/views-laboran.js"></script>
    <script src="js/views-kepalalab.js"></script>
    <script src="js/views-asisten.js"></script>
    <script>
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('side-backdrop');
            const isOpen = sb.classList.contains('translate-x-0');
            if (isOpen) { sb.classList.add('-translate-x-full'); sb.classList.remove('translate-x-0'); bd.classList.add('hidden'); }
            else { sb.classList.remove('-translate-x-full'); sb.classList.add('translate-x-0'); bd.classList.remove('hidden'); }
        }
        document.addEventListener('DOMContentLoaded', () => {
            const u = Auth.current();
            if (u && u.name) {
                const ini = u.name.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() || 'U';
                document.getElementById('user-avatar').textContent = ini;
            }
        });
    </script>
</body>
</html>
